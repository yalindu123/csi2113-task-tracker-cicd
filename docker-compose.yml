services:
  web:
    image: yalinduniruj/csi2113-task-tracker:latest
    container_name: csi2113-task-tracker
    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
