name: CSI2113 CI/CD Pipeline

on:
  push:
    branches: [ "main" ] # Triggers when you push to the main branch

jobs:
  build-test-deploy:
    # Uses your self-hosted Windows runner
    runs-on: self-hosted 
    
    # This is where Solution 1 comes in! We define env vars at the job level.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      IMAGE_NAME: csi2113-webapp # You can change this name

    steps:
      # 1. Git Version Control (Checkout code)
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Build & Test the Application
      # (Assuming Python based on the PDF. Change if using Node.js/other)
      - name: Build and Test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Run your tests here (e.g., unittest or pytest)
          python -m unittest discover -s tests 

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        run: docker login -u ${{ env.DOCKERHUB_USERNAME }} -p ${{ env.DOCKERHUB_TOKEN }}

      # 4. Build Docker Image
      - name: Build Docker Image
        run: docker build -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest .

      # 5. Push Image to Docker Hub
      - name: Push to Docker Hub
        run: docker push ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      # 6. Deploy to Local Computer
      # Because your runner is self-hosted on your PC, this runs docker compose locally!
      - name: Deploy to Local Computer
        run: |
          docker compose down
          docker compose up -d --build
