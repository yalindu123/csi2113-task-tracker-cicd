name: CI/CD Pipeline

# Trigger on every push and PR to main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  IMAGE_NAME: csi2113-task-tracker

jobs:

  # ---------------------------------------------------------
  # 1) BUILD & TEST — install deps, run pytest
  # ---------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  # ---------------------------------------------------------
  # 2) BUILD & PUSH DOCKER IMAGE — to Docker Hub
  # ---------------------------------------------------------
  build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Only push on an actual commit to main, not on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ---------------------------------------------------------
  # 3) DEPLOY TO LOCAL COMPUTER
  #    Requires a self-hosted GitHub Actions runner installed
  #    on YOUR machine (Settings > Actions > Runners > New
  #    self-hosted runner in your GitHub repo). That runner
  #    picks up this job and deploys the freshly pushed image
  #    right there on your computer.
  # ---------------------------------------------------------
  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull latest image from Docker Hub
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy with Docker Compose
        run: |
          export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          sed "s|yalinduniruj|${DOCKERHUB_USERNAME}|g" docker-compose.yml > docker-compose.deploy.yml
          docker compose -f docker-compose.deploy.yml up -d --force-recreate

      - name: Verify container is healthy
        run: |
          sleep 5
          curl -f http://localhost:5000/api/health
