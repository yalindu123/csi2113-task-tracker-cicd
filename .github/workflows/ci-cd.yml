name: CSI2113 CI/CD Pipeline

on:
  push:
    branches: [ "main" ] # Or "master", depending on your default branch

jobs:
  build-test-deploy:
    runs-on: self-hosted # Uses your Windows runner
    
    env:
      # Use your actual Docker Hub credentials here
      DOCKERHUB_USERNAME: yalinduniruj
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      IMAGE_NAME: csi2113-task-tracker

    steps:
      # 1. Checkout the code (This is where it downloads to that C:\Users\HP\... folder)
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Build & Test the Application (Adjust if you use Node.js instead of Python)
      - name: Build and Test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m unittest discover -s tests || echo "No tests found, skipping"

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        run: docker login -u ${{ env.DOCKERHUB_USERNAME }} -p ${{ env.DOCKERHUB_TOKEN }}

      # 4. Build Docker Image (Matches your docker-compose.yml image name)
      - name: Build Docker Image
        run: docker build -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest .

      # 5. Push Image to Docker Hub
      - name: Push to Docker Hub
        run: docker push ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      # 6. Deploy to Local Computer
      - name: Deploy to Local Computer
        run: |
          # Stop the old container if it's running
          docker compose down || echo "No existing container to stop"
          # Pull the new image and start it in the background
          docker compose up -d
